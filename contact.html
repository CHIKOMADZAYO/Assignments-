<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="static/css/style .css">
</head>
<body>
    <header id="site-header"></header>
    <main>
    <div class="container">
        <div class="title">
            <p>Create An Acconut</p>
        </div>
        <div class="input-group">
            <label for="fullname">Full Name</label>
            <input type="text" name="fullname" id="fullname" placeholder="Enter Your Full Name" required>
        </div>
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" name="email"" id="email"" placeholder="Enter Your Email " required>
        </div>
       
        <div class="input-group">
            <label for="address">Address</label>
            <input type="text" name="address" id="address" placeholder="Enter Your Address" required>
        </div>
         <div class="input-group">
            <label for="tellephone">Tellephone</label>
            <input type="tel" name="tellephone" id="tellephone" placeholder="Enter Your Tellephone" required>
        </div>
        <div class="input-group">
                <label for="text-area">Enter Your Message</label>
                <textarea placeholder="Type Your Message Here">

                </textarea>
        </div>
       
        <div class="terms">
            <input type="checkbox" name="terms" id="terms"  required>
            <label for="terms">I Agree To Terms & Conditions</label>

        </div>
        <div class="input-btn">
            <input type="submit" value="Submit" >
        </div>


   </div>
    </main>
    <footer id="site-footer"></footer>
    <script src="static/js/site.js" defer></script>
</body>
</html>
